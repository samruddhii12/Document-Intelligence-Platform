services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docmind"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/docmind}
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["sh", "-c", "python -m alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8000/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 10s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/docmind}
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["python", "-m", "backend.worker"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_URL: http://backend:8000
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pgdata:
